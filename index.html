<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindAR + Three.js WebAR App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* Full-screen AR container */
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    /* Start button overlay */
    #startButton {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 12px 24px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <!-- ES Module Import Maps for Three.js & MindAR -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <button id="startButton">Start AR</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    // 1. Initialize MindARThree instance
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: './card.mind', // Path to your compiled target file
    });

    const { renderer, scene, camera } = mindarThree;

    // 2. Add an Anchor for target index 0 (first target image)
    const anchor = mindarThree.addAnchor(0);

    // 3. Create Three.js 3D Mesh
    const geometry = new THREE.PlaneGeometry(1, 0.55);
    const material = new THREE.MeshBasicMaterial({ 
      color: 0x00ffff, 
      transparent: true, 
      opacity: 0.7 
    });
    const plane = new THREE.Mesh(geometry, material);

    // Attach mesh to the MindAR anchor group
    anchor.group.add(plane);

    // Optional: Target Visibility Event Listeners
    anchor.onTargetFound = () => {
      console.log("Target found");
    };
    anchor.onTargetLost = () => {
      console.log("Target lost");
    };

    // 4. Start AR Session on click
    const startButton = document.querySelector('#startButton');
    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none'; // Hide button after clicking
      
      await mindarThree.start();
      
      // Three.js Render Loop
      renderer.setAnimationLoop(() => {
        // Continuous object animation while tracked
        plane.rotation.z += 0.01;
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
