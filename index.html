<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thar WebAR App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #startButton {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 12px 24px;
      background: #ff2a5f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <!-- ES Import Map for Libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <button id="startButton">Launch AR Camera</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Initialize MindAR
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: './targets.mind',
    });

    const { renderer, scene, camera } = mindarThree;

    // 2. Add Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // 3. Set Up Target Anchor
    const anchor = mindarThree.addAnchor(0);

    // 4. Load your thar.glb model
    const loader = new GLTFLoader();
    
    loader.load(
      './thar.glb', 
      (gltf) => {
        const model = gltf.scene;
        
        // Adjust scale and orientation if needed
        model.scale.set(0.2, 0.2, 0.2); 
        model.rotation.x = Math.PI / 2; 

        anchor.group.add(model);
        console.log('Thar GLB loaded successfully!');
      },
      (progress) => {
        console.log(`Loading GLB: ${(progress.loaded / progress.total * 100).toFixed(0)}%`);
      },
      (error) => {
        console.error('Error loading thar.glb model:', error);
      }
    );

    // 5. Start Engine on User Click
    const startBtn = document.querySelector('#startButton');
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      
      await mindarThree.start();

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
