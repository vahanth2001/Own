<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My WebAR App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #startButton {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 12px 24px;
      background: #ff2a5f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <!-- ES Import Map for Libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <button id="startButton">Launch AR Camera</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Initialize MindAR
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: './targets.mind', // Path to your targets.mind file
    });

    const { renderer, scene, camera } = mindarThree;

    // 2. Add Light Source
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // 3. Set Up Target Anchor (Index 0 = First image in your targets.mind)
    const anchor = mindarThree.addAnchor(0);

    // --- OPTION A: Simple Cyan Plane (Fallback placeholder) ---
    const geometry = new THREE.PlaneGeometry(1, 0.7);
    const material = new THREE.MeshStandardMaterial({ 
      color: 0x00e5ff, 
      transparent: true, 
      opacity: 0.8 
    });
    const plane = new THREE.Mesh(geometry, material);
    anchor.group.add(plane);

    const loader = new GLTFLoader();
    loader.load('./assets/thar.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.2, 0.2, 0.2); // Adjust scale to fit your target
      model.rotation.x = Math.PI / 2; // Adjust orientation
      anchor.group.add(model);
    });

    // 4. Start Engine on User Click
    const startBtn = document.querySelector('#startButton');
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      
      await mindarThree.start();

      // Render loop
      renderer.setAnimationLoop(() => {
        plane.rotation.z += 0.01; // Continuous animation
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
