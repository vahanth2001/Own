<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thar WebAR App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #startButton {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 14px 28px;
      background: #ff2a5f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <!-- ES Import Map for Libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <button id="startButton">Launch AR Camera</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'; // 1. Import DRACOLoader

    // 1. Initialize MindAR Engine
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: './targets.mind',
    });

    const { renderer, scene, camera } = mindarThree;

    // Suppress Three.js color space warning for cleaner console
    if (renderer) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    }

    // 2. Setup Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // 3. Set Up Target Anchor (Index 0)
    const anchor = mindarThree.addAnchor(0);

    // --- FALLBACK RED CUBE HELPER ---
    const testCubeGeometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const testCubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const testCube = new THREE.Mesh(testCubeGeometry, testCubeMaterial);
    testCube.position.set(0, 0, 0.1);
    anchor.group.add(testCube);

    // 4. Configure Draco Decoder & GLTF Loader
    const dracoLoader = new DRACOLoader(); // 2. Instantiate DRACOLoader
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'); // Set decoder CDN path

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader); // 3. Attach DRACOLoader to GLTFLoader

    // 5. Load & Auto-Fit thar.glb
    loader.load(
      './assets/thar.glb?v=5', 
      (gltf) => {
        const model = gltf.scene;

        // Auto-center geometry
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.x += (model.position.x - center.x);
        model.position.y += (model.position.y - center.y);
        model.position.z += (model.position.z - center.z);

        // Auto-scale model
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const scale = 1.0 / maxDim;
          model.scale.set(scale, scale, scale);
        }

        model.rotation.x = Math.PI / 2; // Flat on physical image

        // Hide fallback cube once 3D model is ready
        anchor.group.remove(testCube);
        anchor.group.add(model);
        
        console.log('Thar GLB decoded and loaded successfully!');
      },
      (progress) => {
        if (progress.total > 0) {
          console.log(`Loading GLB: ${(progress.loaded / progress.total * 100).toFixed(0)}%`);
        }
      },
      (error) => {
        console.error('Error loading thar.glb:', error);
      }
    );

    // 6. Trigger Camera Engine on User Click
    const startBtn = document.querySelector('#startButton');
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      
      await mindarThree.start();

      renderer.setAnimationLoop(() => {
        if (testCube.parent) {
          testCube.rotation.x += 0.01;
          testCube.rotation.y += 0.01;
        }
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
