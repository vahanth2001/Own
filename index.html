<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Showroom AR</title>

<!-- Google's <model-viewer> enables 3D + AR when GLB/USDZ models are supplied. -->
<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
:root{
  --blue:#1687ff;
  --dark:#111317;
  --panel:rgba(18,20,24,.90);
  --line:rgba(255,255,255,.13);
  --text:#fff;
  --muted:#b9bec7;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#090a0d;
  color:var(--text);
  overflow:hidden;
}
.showroom{
  position:relative;
  min-height:100vh;
  background:
    linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.10) 45%,rgba(0,0,0,.35)),
    radial-gradient(circle at 50% 35%,#625e55 0,#242329 42%,#090a0d 100%);
}
.showroom:before{
  content:"";
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 140px,rgba(255,255,255,.035) 141px 143px),
    linear-gradient(180deg,rgba(255,255,255,.06),transparent 35%);
  pointer-events:none;
}
.topbar{
  position:absolute;z-index:5;top:16px;left:18px;right:18px;
  display:flex;justify-content:space-between;align-items:center;gap:15px;
}
.brand{
  padding:14px 20px;border:1px solid var(--line);border-radius:18px;
  background:rgba(15,16,20,.78);backdrop-filter:blur(12px);
}
.brand b{display:block;font-size:21px}.brand span{color:#c5c8ce;font-size:13px}
.mode{
  display:flex;background:rgba(15,16,20,.85);border:1px solid var(--line);
  border-radius:28px;padding:4px;
}
.mode button{
  border:0;background:transparent;color:#fff;padding:11px 21px;border-radius:22px;
  font-weight:700;cursor:pointer
}
.mode .active{background:var(--blue)}
.sidebar{
  position:absolute;z-index:4;top:105px;left:18px;width:128px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(12px);
}
.sidebar button{
  width:100%;padding:17px 10px;background:transparent;color:#fff;border:0;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;
}
.sidebar button.active{background:var(--blue)}
.scene{
  position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding:105px 25px 155px 175px;
}
.floor{
  position:absolute;left:10%;right:5%;bottom:0;height:44%;
  background:linear-gradient(160deg,#77726a,#24252a 55%,#111216);
  transform:perspective(600px) rotateX(58deg);
  transform-origin:bottom;
  opacity:.85;
}
.wall{
  position:absolute;left:15%;right:6%;top:19%;height:49%;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(90deg,rgba(0,0,0,.75),rgba(30,30,34,.55)),
    repeating-linear-gradient(90deg,#222 0 100px,#17181b 101px 103px);
  box-shadow:0 20px 80px #000;
}
.logo{
  position:absolute;top:28%;left:57%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:800;letter-spacing:1px
}
.logo:before{content:"🏍️ ";filter:grayscale(1)}
.poster{
  position:absolute;top:30%;width:18%;height:30%;padding:20px;
  display:flex;align-items:flex-end;font-weight:900;font-size:20px;
  background:linear-gradient(145deg,#173e72,#7d553d 60%,#121316);
  border:5px solid #111;box-shadow:0 10px 30px #0008;
}
.poster.one{left:18%}.poster.two{left:38%}.poster.three{left:67%}
.bikes{
  position:relative;z-index:2;width:min(980px,85vw);height:420px;
  display:flex;align-items:flex-end;justify-content:center;gap:30px;
}
.bike{
  width:300px;height:220px;position:relative;filter:drop-shadow(0 25px 18px #000);
}
.wheel{
  position:absolute;bottom:18px;width:82px;height:82px;border:11px solid #17191d;
  border-radius:50%;background:radial-gradient(circle,#666 0 7%,#15171a 8% 32%,#555 33% 36%,#111 37%);
}
.wheel.a{left:20px}.wheel.b{right:20px}
.body{
  position:absolute;left:65px;right:55px;bottom:58px;height:72px;
  border-radius:55% 45% 20% 25%;background:var(--bike,#1976ff);
  transform:skewX(-15deg);box-shadow:inset -15px -8px 18px #0007;
}
.tank{
  position:absolute;left:102px;bottom:110px;width:85px;height:48px;
  border-radius:45% 60% 30% 30%;background:var(--bike,#1976ff);transform:rotate(-10deg);
}
.seat{position:absolute;left:158px;bottom:116px;width:90px;height:16px;border-radius:12px;background:#111}
.handle{position:absolute;right:35px;bottom:144px;width:62px;height:8px;background:#17191d;transform:rotate(-14deg)}
.head{position:absolute;right:40px;bottom:125px;width:38px;height:36px;border-radius:50% 40% 40% 50%;background:var(--bike,#1976ff)}
.info{
  position:absolute;z-index:5;left:50%;bottom:235px;transform:translateX(-50%);
  width:210px;padding:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;backdrop-filter:blur(12px)
}
.info h3{margin:0 0 7px}.price{font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:12px}
.info button,.action{
  width:100%;border:0;border-radius:10px;padding:11px;background:var(--blue);
  color:#fff;font-weight:800;cursor:pointer;margin-top:10px
}
.color-row{display:flex;gap:8px;margin:9px 0}.dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.dot.blue{background:#1676e8}.dot.black{background:#111}.dot.red{background:#ed2637}.dot.white{background:#eee}
.actions{
  position:absolute;z-index:5;right:18px;bottom:220px;width:160px;display:grid;gap:10px
}
.action{background:var(--panel);border:1px solid var(--line);margin:0;text-align:left}
.bottom{
  position:absolute;z-index:6;left:18px;right:18px;bottom:18px;height:116px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  display:flex;align-items:center;gap:10px;padding:10px 16px;overflow:auto;
  backdrop-filter:blur(14px)
}
.card{
  min-width:170px;height:94px;border-radius:12px;padding:8px;background:#22252a;
  border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;
}
.card.active{border:2px solid var(--blue)}
.card .mini-bike{height:52px;position:relative;transform:scale(.65)}
.card span{font-size:12px;font-weight:700}
.ar-arrow{
  position:absolute;z-index:4;left:50%;bottom:285px;transform:translateX(-50%);
  color:#41a4ff;font-size:42px;text-shadow:0 0 18px #1687ff
}
model-viewer{
  position:fixed;inset:0;width:100%;height:100%;z-index:20;background:#111;
}
.hidden{display:none!important}
.toast{
  position:fixed;z-index:30;left:50%;bottom:145px;transform:translateX(-50%);
  background:#111b;color:#fff;border:1px solid var(--line);padding:12px 18px;
  border-radius:12px;display:none
}
@media(max-width:800px){
  .sidebar{display:none}.scene{padding-left:20px}.poster{display:none}
  .info{bottom:245px}.actions{right:10px;bottom:240px;width:130px}
  .brand{font-size:12px}.brand b{font-size:16px}
}
</style>
</head>

<body>
<div class="showroom">
  <div class="topbar">
    <div class="brand"><b>📍 Bike Showroom (AR View)</b><span>Explore | View | Customize | Buy</span></div>
    <div class="mode"><button class="active" onclick="setMode('AR',this)">AR</button><button onclick="setMode('3D',this)">3D</button></div>
  </div>

  <aside class="sidebar">
    <button class="active">⌂ &nbsp; Home</button>
    <button>🏍 &nbsp; Bikes</button>
    <button>🛵 &nbsp; Scooters</button>
    <button>◆ &nbsp; Offers</button>
    <button onclick="showToast('Point your phone camera at a flat surface for AR.')">◉ &nbsp; AR Info</button>
  </aside>

  <div class="scene">
    <div class="wall"></div><div class="floor"></div>
    <div class="poster one">RIDE<br>YOUR<br>WORLD</div>
    <div class="poster two">ADVENTURE<br>EVERYDAY</div>
    <div class="poster three">BUILT<br>FOR<br>MORE</div>
    <div class="logo">BIKE SHOWROOM</div>

    <div class="bikes">
      <div class="bike" id="bike" style="--bike:#1976ff">
        <div class="wheel a"></div><div class="wheel b"></div>
        <div class="body"></div><div class="tank"></div><div class="seat"></div>
        <div class="handle"></div><div class="head"></div>
      </div>
    </div>

    <div class="ar-arrow">⌃<br><small style="font-size:15px">3 m</small></div>

    <div class="info">
      <h3 id="bikeName">Yamaha R15 V4</h3>
      <div class="price" id="bikePrice">₹1,82,000</div>
      <div class="muted">Ex-showroom</div>
      <div class="color-row">
        <span class="dot blue" onclick="changeColor('#1976ff')"></span>
        <span class="dot black" onclick="changeColor('#111')"></span>
        <span class="dot red" onclick="changeColor('#e92335')"></span>
        <span class="dot white" onclick="changeColor('#eee')"></span>
      </div>
      <button onclick="openAR()">View in 3D / AR</button>
    </div>

    <div class="actions">
      <button class="action" onclick="showToast('Test ride request selected.')">🛒 Book Test Ride</button>
      <button class="action" onclick="showToast('Showing bike specifications.')">◉ View Details</button>
      <button class="action" onclick="document.querySelector('.color-row').scrollIntoView()">🎨 Change Color</button>
    </div>
  </div>

  <div class="bottom" id="bikeList"></div>
</div>

<div class="toast" id="toast"></div>

<!--
  Replace MODEL_URL below with your own .glb file.
  For real WebXR AR, host the page over HTTPS and use a compatible phone/browser.
-->
<model-viewer id="viewer"
  class="hidden"
  src=""
  ios-src=""
  alt="Selected motorcycle"
  camera-controls
  auto-rotate
  ar
  ar-modes="webxr scene-viewer quick-look"
  shadow-intensity="1">
</model-viewer>

<script>
const bikes = [
  {name:"Yamaha R15 V4", price:"₹1,82,000", color:"#1976ff", model:"models/yamaha-r15-v4.glb"},
  {name:"Royal Enfield Classic 350", price:"₹1,93,080", color:"#111", model:"models/classic-350.glb"},
  {name:"Bajaj Pulsar N250", price:"₹1,51,000", color:"#e92335", model:"models/pulsar-n250.glb"},
  {name:"Hero Xtreme 160R", price:"₹1,12,000", color:"#777", model:"models/xtreme-160r.glb"},
  {name:"Honda Activa 125", price:"₹95,000", color:"#eee", model:"models/activa-125.glb"},
  {name:"TVS Jupiter", price:"₹82,000", color:"#e92335", model:"models/jupiter.glb"}
];

const list = document.getElementById("bikeList");
const bike = document.getElementById("bike");

function renderList(){
  list.innerHTML = bikes.map((b,i)=>`
    <div class="card ${i===0?'active':''}" onclick="selectBike(${i},this)">
      <div class="mini-bike" style="--bike:${b.color}">
        <div class="wheel a"></div><div class="wheel b"></div>
        <div class="body"></div><div class="tank"></div>
        <div class="seat"></div><div class="head"></div>
      </div>
      <span>${b.name}</span>
    </div>`).join("");
}
function selectBike(i,el){
  const b=bikes[i];
  document.querySelectorAll(".card").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("bikeName").textContent=b.name;
  document.getElementById("bikePrice").textContent=b.price;
  bike.style.setProperty("--bike",b.color);
  document.getElementById("viewer").src=b.model;
}
function changeColor(c){
  bike.style.setProperty("--bike",c);
  showToast("Bike color changed.");
}
function setMode(mode,el){
  document.querySelectorAll(".mode button").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
  showToast(mode+" mode selected.");
}
function openAR(){
  const viewer=document.getElementById("viewer");
  if(!viewer.src){
    showToast("Add your motorcycle .glb model files in /models first.");
    return;
  }
  viewer.classList.remove("hidden");
  if(viewer.canActivateAR) viewer.activateAR();
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.style.display="none",2500);
}
renderList();
</script>
</body>
</html>
