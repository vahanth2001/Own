<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thar WebAR App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Start Button */
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300;
      padding: 16px 32px;
      background: #ff2a5f;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
    }

    /* Loading Screen Overlay */
    #loadingScreen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .progress-bar-container {
      width: 70%;
      max-width: 300px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ff2a5f;
      transition: width 0.1s ease;
    }

    /* Interactive AR Control Menu */
    #arMenu {
      display: none;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 30px;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .menu-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .btn-red { background: #d32f2f; }
    .btn-black { background: #111111; }
    .btn-white { background: #ffffff; }

    .action-btn {
      background: #ff2a5f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
  </style>

  <!-- ES Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <button id="startButton">Launch AR Camera</button>
  <div id="container"></div>

  <!-- Loading Screen Element -->
  <div id="loadingScreen">
    <div style="font-size: 18px; font-weight: bold;">Loading 3D Thar...</div>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="progressText" style="margin-top: 8px; font-size: 12px; color: #aaa;">0%</div>
  </div>

  <!-- AR Control Menu -->
  <div id="arMenu">
    <div class="menu-btn btn-red" id="colorRed" title="Red"></div>
    <div class="menu-btn btn-black" id="colorBlack" title="Black"></div>
    <div class="menu-btn btn-white" id="colorWhite" title="White"></div>
    <button class="action-btn" id="rotateBtn">Auto-Rotate</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. Initialize MindAR Engine
    const mindarThree = new MindARThree({
      container: document.querySelector('#container'),
      imageTargetSrc: './targets.mind',
    });

    const { renderer, scene, camera } = mindarThree;

    if (renderer) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    }

    // 2. Setup Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // 3. Set Up Target Anchor (Index 0)
    const anchor = mindarThree.addAnchor(0);

    let tharModel = null;
    let isAutoRotating = false;

    // 4. Configure Draco Decoder & GLTF Loader
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // UI Elements
    const startBtn = document.querySelector('#startButton');
    const loadingScreen = document.querySelector('#loadingScreen');
    const progressBar = document.querySelector('#progressBar');
    const progressText = document.querySelector('#progressText');
    const arMenu = document.querySelector('#arMenu');

    // 5. Function to load model
    function loadModel() {
      return new Promise((resolve, reject) => {
        loader.load(
          './thar.glb?v=8', 
          (gltf) => {
            tharModel = gltf.scene;

            // Auto-center geometry
            const box = new THREE.Box3().setFromObject(tharModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            tharModel.position.x += (tharModel.position.x - center.x);
            tharModel.position.y += (tharModel.position.y - center.y);
            tharModel.position.z += (tharModel.position.z - center.z);

            // Auto-scale model
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scale = 1.0 / maxDim;
              tharModel.scale.set(scale, scale, scale);
            }

            tharModel.rotation.x = Math.PI / 2;
            anchor.group.add(tharModel);
            resolve();
          },
          (progress) => {
            if (progress.total > 0) {
              const percent = Math.min(Math.round((progress.loaded / progress.total) * 100), 100);
              progressBar.style.width = percent + '%';
              progressText.innerText = percent + '%';
            }
          },
          (error) => {
            console.error('Error loading model:', error);
            reject(error);
          }
        );
      });
    }

    // 6. Color customization helpers
    function setModelColor(colorHex) {
      if (!tharModel) return;
      tharModel.traverse((node) => {
        if (node.isMesh && node.material) {
          node.material.color.setHex(colorHex);
        }
      });
    }

    document.querySelector('#colorRed').addEventListener('click', () => setModelColor(0xd32f2f));
    document.querySelector('#colorBlack').addEventListener('click', () => setModelColor(0x111111));
    document.querySelector('#colorWhite').addEventListener('click', () => setModelColor(0xffffff));

    const rotateBtn = document.querySelector('#rotateBtn');
    rotateBtn.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      rotateBtn.innerText = isAutoRotating ? 'Stop Rotation' : 'Auto-Rotate';
    });

    // 7. Start Engine Sequence
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      loadingScreen.style.display = 'flex';
      
      try {
        // Start camera stream first
        await mindarThree.start();
        
        // Load model asset
        await loadModel();

        // Hide overlay and show menu
        loadingScreen.style.display = 'none';
        arMenu.style.display = 'flex';

        renderer.setAnimationLoop(() => {
          if (tharModel && isAutoRotating) {
            tharModel.rotation.z += 0.01;
          }
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error('AR Initialization Failed:', err);
        progressText.innerText = 'Failed to start AR Camera or Load Asset.';
      }
    });
  </script>
</body>
</html>
